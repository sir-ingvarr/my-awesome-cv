name: Release CV PDF

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDF
        run: npm run build

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version tag: $TAG"

      - name: Check tag is not already used
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Update the version in package.json before pushing."
            exit 1
          fi
          if git rev-parse "$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Update the version in package.json before pushing."
            exit 1
          fi

      - name: Retire previous latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view latest > /dev/null 2>&1; then
            echo "Retiring current latest release as $TAG"

            LATEST_SHA=$(gh release view latest --json targetCommitish --jq '.targetCommitish')

            mkdir -p /tmp/release-assets
            gh release download latest --dir /tmp/release-assets || true

            gh release delete latest --yes --cleanup-tag

            ASSET_FLAGS=""
            for f in /tmp/release-assets/*; do
              [ -f "$f" ] && ASSET_FLAGS="$ASSET_FLAGS $f"
            done

            if [ -n "$ASSET_FLAGS" ]; then
              gh release create "$TAG" --target "$LATEST_SHA" --title "$TAG" --notes "Retired from latest" $ASSET_FLAGS
            else
              gh release create "$TAG" --target "$LATEST_SHA" --title "$TAG" --notes "Retired from latest"
            fi
          fi

      - name: Create latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --target "${{ github.sha }}" \
            --title "latest" \
            --notes "Latest CV build from master" \
            Igor_Berezin_CV.pdf \
            Igor_Berezin_CV_UA.pdf
